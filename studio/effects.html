<style>
#effects{--fx-base:#101521;--fx-line:#36415a;--fx-accent:#c7baff;--fx-rail:#090d16;background:var(--fx-base);border-color:var(--fx-line)}
#effects h1{letter-spacing:-.05em;margin-bottom:.5rem} #effects h2{margin-bottom:.5rem} #effects p{margin:.5rem 0 .85rem}
#effects .fx-preview{margin-bottom:1.5rem} #effects .fx-meta{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
#effects .fx-rail{display:flex;align-items:center;gap:clamp(1px,.35vw,5px);height:4rem;padding:.7rem;margin:.45rem 0;background:var(--fx-rail);border:1px solid var(--fx-line);border-radius:3px}
#effects .fx-rail i{flex:1;min-width:0;height:52%;border-radius:2px;background:#253043;box-shadow:inset 0 0 0 1px #ffffff20} #effects .fx-rail i:nth-child(8n){height:75%}
#effects .fx-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(1rem,3vw,2rem)} #effects .fx-tune{border-left:1px solid var(--fx-line);padding-left:clamp(1rem,3vw,2rem)}
#effects .fx-list{list-style:none;padding:0;margin:.6rem 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10rem),1fr));gap:.4rem;max-height:24rem;overflow:auto;padding:4px;scrollbar-color:var(--fx-line) var(--fx-base)}
#effects .fx-list li{margin:0;min-width:0} #effects .fx-list button{display:flex;align-items:center;text-align:left;gap:.4rem;width:100%;height:100%;padding:.5rem .65rem;color:var(--text);overflow-wrap:anywhere}
#effects button,#effects select{border-radius:3px;border:1px solid var(--fx-line);color:var(--fx-accent)} #effects button[aria-pressed=true]{background:var(--fx-accent);color:var(--fx-rail);border-color:var(--fx-accent)} #effects .fx-star{margin-left:auto}
#effects select{font:inherit;min-height:44px;padding:.4rem;background:var(--panel);max-width:100%} #effects input[type=range]{accent-color:var(--fx-accent);margin:0}
#effects .fx-slider label{display:flex;justify-content:space-between;gap:.75rem;font-size:.9rem;color:var(--muted)} #effects output{color:var(--text)}
#effects #fx-status{min-height:1.5em;margin-bottom:0} #effects #fx-status[data-error=true]{color:#ffb6aa}
@media(max-width:660px){#effects .fx-grid{grid-template-columns:1fr}#effects .fx-tune{border-left:0;padding:1rem 0 0;border-top:1px solid var(--fx-line)}}
</style>
<section id="effects" data-view hidden tabindex="-1" aria-labelledby="fx-title">
  <h1 id="fx-title">Effects Studio</h1>
  <div class="fx-preview">
    <div class="fx-meta"><strong id="fx-preview-label">Strip simulation</strong><small id="fx-frame">Waiting for effect state</small></div>
    <div class="fx-rail" id="fx-rail" aria-hidden="true"></div>
    <small id="fx-preview-note">An approximation, not a reading from the physical LEDs.</small>
  </div>
  <div class="fx-grid">
    <div>
      <h2>Effect catalog</h2>
      <div class="line"><select id="fx-category" aria-label="Effect category"><option value="">All categories</option></select><button id="fx-filter" type="button" aria-pressed="false">Favorites only</button></div>
      <ul id="fx-list" class="fx-list" aria-label="Available effects"></ul>
      <p id="fx-empty" hidden></p>
    </div>
    <div class="fx-tune">
      <h2 id="fx-name">Effect controls</h2>
      <p id="fx-description"></p>
      <fieldset id="fx-controls" aria-label="Effect controls" disabled>
        <div id="fx-parameters"></div>
        <div id="fx-playback"></div>
        <div class="line"><button id="fx-favorite" type="button" aria-pressed="false">Favorite</button><button id="fx-reset" type="button">Reset effect</button><button id="fx-stop" type="button">Stop to solid</button></div>
      </fieldset>
    </div>
  </div>
  <div class="line"><p id="fx-status" role="status">Loading effects…</p><button id="fx-retry" type="button" hidden>Retry effects</button></div>
</section>
