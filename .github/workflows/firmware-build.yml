name: Build LUMINA STUDIO firmware

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install toolchain, compile, validate and package
        run: python3 scripts/build.py
      - name: Upload verified firmware and editable source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LUMINA-STUDIO-${{ github.run_number }}
          path: dist/download/
          if-no-files-found: error
          retention-days: 30
      - name: Upload release bundle for publication
        if: github.event_name == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-bundle
          path: dist/LUMINA_STUDIO.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-bundle
      - name: Attach ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" LUMINA_STUDIO.zip --repo "$GITHUB_REPOSITORY" --clobber
